<footer class="footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                    <!-- <span class="ml-3 busuanzi">
                        Visitors: <span id="busuanzi_value_site_uv">--</span> ; Pageviews: <span id="busuanzi_value_site_pv">--</span>
                    </span> -->
                    <!-- Visitor stats link (no embedded map) -->
                    <span class="ml-3 visitor-map" aria-label="Visitor Stats">
                        <a href="{{ '/globe.html' | relative_url }}" rel="noopener">View visitor stats</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
    <script defer src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    {% unless page.mapmyvisitors_embed %}
    {% assign mmv_key = site.mapmyvisitors_key | default: "urZaTpKgk8ESz2YD-FyZkniO2IYgT4asm3CFx1-FNSE" %}
    <img class="mapmyvisitors-pixel"
         src="https://mapmyvisitors.com/map.png?d={{ mmv_key }}"
         width="1"
         height="1"
         alt=""
         aria-hidden="true"
         referrerpolicy="no-referrer-when-downgrade">
    {% endunless %}
</footer>
