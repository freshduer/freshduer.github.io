periods:
  - pillar: "甲午"
    span: "2004 – 2014"
    age: "4–14 岁"
    early_years: "2004 – 2009"
    late_years: "2010 – 2014"
    score: 40
    score_early: 45
    score_late: 35
    feeling_early: "童年多病，被烫伤，数学我记得还行 真是想法设法的玩啊 太爱玩了"
    feeling_late: "体质偏弱，易有发热、炎症等健康问题，被晒伤，童年略显多愁善感，学业不佳（60个人倒数第二，很爱玩 好朋友最后都分开了）。"

  - pillar: "癸巳"
    span: "2014 – 2024"
    age: "14–24 岁"
    early_years: "2014 – 2019"
    late_years: "2020 – 2024"
    score: 55
    score_early: 55
    score_late: 50
    feeling_early: "癸水：食神透出，聪慧好学（14年初二开始就很聪明 真是神奇 高中从来都是第一名）还好靠着癸水考上985了。
    但巳火为忌内心压力较大，易有焦躁情绪（内心压力大很痛苦 军训被晒伤 经常被晒伤 紫外线过敏了开始）。"
    feeling_late: "巳火：学业或初入职场时感到阻力重重，身心俱疲（感觉脑袋没有之前那么灵动了），感情不顺利 压力很大 一直吵架。"

  - pillar: "壬辰"
    span: "2024 – 2034"
    age: "24–34 岁"
    early_years: "2024 – 2029"
    late_years: "2030 – 2034"
    score: 82.5
    score_early: 85
    score_late: 80
    current: true
    feeling_early: "壬水伤官 25年开始读博 舒服多了 25年 26年都有A会简直就是开挂了 乙巳丙午官杀年都能这样 之后印比运不知道得多爽 看看2829年啥情况 好像这波会很帅"
    feeling_late: "辰为湿土，能晦火养金，是“印星”库。这五年转为稳扎稳打的阶段，事业根基趋向稳固，可能会获得名誉、职权或房产等实质性资产。但辰土毕竟为土，内藏乙木、癸水，有“水入水库”之象，心性会从激进转向保守，有时会感到压抑和束缚，不如前五年洒脱。"

  - pillar: "辛卯"
    span: "2034 – 2044"
    age: "34–44 岁"
    early_years: "2034 – 2039"
    late_years: "2040 – 2044"
    score: 70
    score_early: 75
    score_late: 65
    feeling_early: "比肩帮身，事业上得朋友、同事之助，团队合作顺利，可共谋发展。"
    feeling_late: "卯未半合木局，财星力量增强，但木生火旺，求财辛苦。此阶段需防范投资风险，以守成为主。"

  - pillar: "庚寅"
    span: "2044 – 2054"
    age: "44–54 岁"
    early_years: "2044 – 2049"
    late_years: "2050 – 2054"
    score: 76
    score_early: 82
    score_late: 70
    feeling_early: "庚金为劫财，是强力的帮身之神。此五年将汇聚人脉与资源，事业上可得强力伙伴或团队的助力，适合开拓市场、共同创业。个人威信与执行力大增，是巩固事业版图的黄金期。"
    feeling_late: "寅木为正财，且寅午半合火局，财星生旺忌神。此阶段求财欲望增强，机遇与风险并存。正财主稳定收入，但火势过旺，需警惕因扩张、投资或人事问题带来的财务压力。宜稳守主业，戒骄戒躁。"

  - pillar: "己丑"
    span: "2054 – 2064"
    age: "54–64 岁"
    early_years: "2054 – 2059"
    late_years: "2060 – 2064"
    score: 82
    score_early: 80
    score_late: 85
    feeling_early: "己土偏印透出，干支皆为湿土，能有效晦火生金。此运为厚积薄发之时，内心趋于沉稳，智慧圆融。事业上易得贵人扶持，或从幕后策划、学术研究等领域获得成就感，地位稳固。"
    feeling_late: "丑为金库，亦为湿土，是命局的“墓库”与“根气”。此五年是人生收获与总结的阶段，不仅物质财富丰盈，精神世界也极为富足。家庭和美，子女贤孝，可尽享天伦之乐。此乃一生中最为安稳平顺的时期。"

  - pillar: "戊子"
    span: "2064 – 2074"
    age: "64–74 岁"
    early_years: "2064 – 2069"
    late_years: "2070 – 2074"
    score: 88
    score_early: 75
    score_late: 92
    feeling_early: "戊土正印透干，合绊癸水。此阶段可能会有新的社会职责或名誉加身，但内心或有束缚感，不如想象中洒脱。"
    feeling_late: "子水为“禄神”与“文昌”，是命局最喜的用神之一。子水冲开火局，调候得力，可谓晚景灿然。思维清晰，体魄康健，儿孙绕膝，是人生智慧的巅峰时期，能享清福，名利双收。"

  - pillar: "丁亥"
    span: "2074 – 2084"
    age: "74–84 岁"
    early_years: "2074 – 2079"
    late_years: "2080 – 2084"
    score: 78
    score_early: 70
    score_late: 85
    feeling_early: "七杀透出，精力有所不济，需注意心血管及突发健康问题，宜静养。"
    feeling_late: "亥水为伤官，冲克巳火，反而能激发晚年的活力与创造力，心境豁达，乐观开朗，得享高寿。"
