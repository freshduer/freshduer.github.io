# 页面说明文字（每行一条，会自动换行）
lead:
  - "希望用这个页面来印证这一辈子人生剧本里 八字在我身上的效果。"
  - "八字大运的分数看曲线；下方文字是每步大运前五年 / 后五年的真实自我体感描写。"
  - "还没经历的年份就先放上Ai的评价。"

periods:
  - pillar: "甲午"
    span: "2004 – 2014"
    age: "4–14 虚岁"
    early_years: "2004 – 2009"
    late_years: "2010 – 2014"
    score: 40
    score_early: 45
    score_late: 35
    feeling_early: "甲午 我这个八字不喜欢财星 更别提财星+七杀的大运 木生火恶性循环导致官杀更重 官杀重体现就是压力大 内耗不开心 
    会导致童年多病，被烫伤，小时候太爱玩了 学习也不好。这五年唯一的好处可能就是正财透出 和女生玩的还都挺好 这五年好朋友好像都是女生 命理真是神奇"
    feeling_late: "小学 下五年真正走入七杀运 命理体现就是会更难过 更不好。体质偏弱，易有发热、炎症等健康问题，被晒伤，童年略显多愁善感，官杀太重就容易焦虑
    学业不佳 小学60个人里倒数第二 很爱玩 好朋友最后都因为各种原因分开了 回想起来当时虽然玩的时候很快乐 但是印象最深刻的还是离别和一些悲伤的事情"

  - pillar: "癸巳"
    span: "2014 – 2024"
    age: "14–24 虚岁"
    early_years: "2014 – 2019"
    late_years: "2020 – 2024"
    score: 55
    score_early: 55
    score_late: 50
    feeling_early: "初二到高中 癸水：食神透出对应就是才华外露 13年初一还是倒数第一 到了14年底冬天初二开始就很聪明 这也太快了 真是神奇 
    之后高中从来都是第一名 还好靠着癸水考上985了。
    虽然上五年大运一般是天干主导 但地支巳火为忌伏吟太多 仍然会有很大影响 或者说天干是外显 地支是内心真实感受
    对应内心压力较大，易有焦躁情绪（内心压力大很痛苦 军训被晒伤 经常被晒伤 开始紫外线过敏了）。"
    feeling_late: "大二到本科毕业第一年 巳火：本来命盘就很多巳火 巳巳伏吟 放大了官杀的力量 导致本来的一点癸水就被蒸干了 体现就是内心急躁 周围环境也都是压力 
    我感觉这五年没有什么特别开心的日子 开心也是内心挺焦虑的 每天都在宿舍窝着 母鸡大学生活到底啥样😌
    对应学业或初入职场时感到阻力重重，身心俱疲 感觉脑袋没有之前那么灵动了，感情不顺利 压力很大 一直吵架。"

  - pillar: "壬辰"
    span: "2024 – 2034"
    age: "24–34 虚岁"
    early_years: "2024 – 2029"
    late_years: "2030 – 2034"
    score: 82.5
    score_early: 85
    score_late: 80
    current: true
    feeling_early: "本科毕业第一年到博士毕业工作第一年 这个大运上下都是很好的 从坏大运到好大运鲜明的特点就是说周围人全换 地点也换 所以会从北京打工仔到香港读书 为未来发展铺垫
    上五年壬水伤官 25年开始读博 舒服多了 25,26两年乙巳丙午官杀年都可以发出去论文 从27年底应该会开始有一些事情的苗头 从28年中戊申年应该会开始走真正的事业运 之前都是铺垫
    我觉得从坏大运换号大运需要给大运一点时间整理自己 2-3年才能真正切换过去"
    feeling_late: "博士毕业后工作第二年到第六年 现在还没经历 我自己分析 辰为湿土，能晦火养金，是印星 对应会有贵人或者适合做研究。 
    而且流年都是食伤年 应该财星很旺 这5年 30-34年 要么是开财库 要么是食伤+正财年 
    食伤生财 男人的财星对应桃花 都很旺 我只能说太现实了吧大姐们。。毕业了都来了
    不同于下个大运的财运 这几年应该是很舒服的几年 如果我还没结婚应该这个时候会结婚了 要么就得34-35年了 
    这五年转为稳扎稳打的阶段，事业根基趋向稳固，可能会获得名誉、职权或房产等实质性资产 
    我的理解是不要搞那些破桃花尽量把财星转化为固定资产 因为下个大运财星重但是不像这个大运有壬辰帮我了 应该求财都是辛苦得到的 如果能靠着之前积累稳一下应该可以轻松一点 
    可能这也是算命的意义。"

  - pillar: "辛卯"
    span: "2034 – 2044"
    age: "34–44 虚岁"
    early_years: "2034 – 2039"
    late_years: "2040 – 2044"
    score: 70
    score_early: 75
    score_late: 65
    feeling_early: "比肩帮身，事业上得朋友、同事之助，团队合作顺利，可共谋发展。"
    feeling_late: "卯未半合木局，财星力量增强，但木生火旺，求财辛苦。财运桃花很多，但是都是辛苦赚的钱。此阶段需防范投资风险，以守成为主。"

  - pillar: "庚寅"
    span: "2044 – 2054"
    age: "44–54 岁"
    early_years: "2044 – 2049"
    late_years: "2050 – 2054"
    score: 76
    score_early: 82
    score_late: 70
    feeling_early: "庚金为劫财，是强力的帮身之神。此五年将汇聚人脉与资源，事业上可得强力伙伴或团队的助力，适合开拓市场、共同创业。个人威信与执行力大增，是巩固事业版图的黄金期。"
    feeling_late: "寅木为正财，且寅午半合火局，财星生旺忌神。此阶段求财欲望增强，机遇与风险并存。正财主稳定收入，但火势过旺，需警惕因扩张、投资或人事问题带来的财务压力。宜稳守主业，戒骄戒躁。"

  - pillar: "己丑"
    span: "2054 – 2064"
    age: "54–64 岁"
    early_years: "2054 – 2059"
    late_years: "2060 – 2064"
    score: 82
    score_early: 80
    score_late: 85
    feeling_early: "己土偏印透出，干支皆为湿土，能有效晦火生金。此运为厚积薄发之时，内心趋于沉稳，智慧圆融。事业上易得贵人扶持，或从幕后策划、学术研究等领域获得成就感，地位稳固。"
    feeling_late: "丑为金库，亦为湿土，是命局的“墓库”与“根气”。此五年是人生收获与总结的阶段，不仅物质财富丰盈，精神世界也极为富足。家庭和美，子女贤孝，可尽享天伦之乐。此乃一生中最为安稳平顺的时期。"

  - pillar: "戊子"
    span: "2064 – 2074"
    age: "64–74 岁"
    early_years: "2064 – 2069"
    late_years: "2070 – 2074"
    score: 88
    score_early: 75
    score_late: 92
    feeling_early: "戊土正印透干，合绊癸水。此阶段可能会有新的社会职责或名誉加身，但内心或有束缚感，不如想象中洒脱。"
    feeling_late: "子水为“禄神”与“文昌”，是命局最喜的用神之一。子水冲开火局，调候得力，可谓晚景灿然。思维清晰，体魄康健，儿孙绕膝，是人生智慧的巅峰时期，能享清福，名利双收。"

  - pillar: "丁亥"
    span: "2074 – 2084"
    age: "74–84 岁"
    early_years: "2074 – 2079"
    late_years: "2080 – 2084"
    score: 78
    score_early: 70
    score_late: 85
    feeling_early: "七杀透出，精力有所不济，需注意心血管及突发健康问题，宜静养。"
    feeling_late: "亥水为伤官，冲克巳火，反而能激发晚年的活力与创造力，心境豁达，乐观开朗，得享高寿。"
