short_bio: >-
  <p>
  I am Wenjun Yu (俞文军), a first-year Ph.D. student in Computer Science at Hong Kong Baptist University, 
  supervised by Prof. <a href="https://amelieczhou.github.io/" class="profile_href">Amelie Chi Zhou</a>. 
  Prior to that, I received my B.S. in Artificial Intelligence from Dalian University of Technology.</p>
  <p>
  My research interests lie broadly in DLRM training/serving optimization, generative RecSys acceleration and GPU Virtualization techniques.</p>
  <p>
  Outside of my academic work, I'm deeply curious about traditional Chinese metaphysics. 
  I've explored systems such as Bazi, Ziwei Doushu, and Xiao Liu Ren, and enjoy studying
  how these classical frameworks interpret patterns, fate, and decision-making. 
  Explore my life Bazi score K-line chart <a href="https://lifekline-ruby.vercel.app/" target="_blank" rel="noopener noreferrer">here</a>.
  </p>

