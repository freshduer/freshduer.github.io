# 美食相册：每道菜/每次下厨是一个条目
# 图片放在 assets/images/cooking/<中文菜名>/ 下，然后在这里引用
#
# 字段说明：
#   title / description         — 标题、一句话简介
#   pinned: true                — 置顶（始终排在最前）
#   note                        — 备注说明（不是做法，不会显示「有做法教程」）
#   ingredients                 — 食材列表（可选）
#   steps                       — 做法步骤（可选）
#   images                      — 成品/过程照片（请用 jpg/png/webp；heic 浏览器基本不支持，需先转 jpg）

dishes:
  - title: "Finished Cooking Recipes"
    pinned: true
    description: "这是我目前已经尝试过的菜谱，欢迎你来尝试哦！"
    note: "这是我目前已经尝试过的菜谱，欢迎你来尝试哦！"
    images:
      - src: /assets/images/cooking/list.jpg

  - title: "黄豆炖猪蹄"
    description: "真空卤猪蹄版，软糯入味；下次黄豆先煮再炖会更烂"
    ingredients:
      - "真空卤猪蹄（已入味，切片即可）"
      - "黄豆（提前一晚泡发）"
      - "黄冰糖 3 颗"
      - "生抽 半勺"
      - "香叶 1 片"
      - "桂皮 一小段（约指甲盖大小）"
      - "八角 1 个"
      - "干辣椒 2 个（偏淡，下次可多加）"
    steps:
      - "黄豆提前一晚泡发；下次改进：泡好后先单独煮约 20 分钟，再和猪蹄一起炖，会更软烂"
      - "真空卤猪蹄不用焯水、不用炒糖色，直接切片"
      - "开水下锅，放入猪蹄和黄豆，小火炖；加黄冰糖 3 颗、生抽半勺、香叶、桂皮、八角、干辣椒"
      - "炖约 20 分钟后把香料捞出"
      - "炖满半小时后可转大火（电磁炉火力偏弱时）；注意别煮干，适时加水"
      - "总共炖约 1 小时即可；这次黄豆还不够软烂，按第一步先煮黄豆再合炖会更好"
    images:
      - src: /assets/images/cooking/黄豆炖猪蹄/1.jpg

  - title: "红烧肉"
    description: "炒糖色裹匀，小火咕噜后大火收汁；香料宜早捞，桂皮慎用"
    ingredients:
      - "五花肉"
      - "黄冰糖（油要能漫过冰糖）"
      - "生抽 2 勺"
      - "老抽 很少一点（上色用）"
      - "香叶、八角（感觉八角就够了；桂皮味太大，可不放或少放）"
      - "盐（收汁后若偏淡再补一点）"
    steps:
      - "五花肉焯水，洗干净"
      - "油小火炒黄冰糖（油漫过冰糖）；冒小泡泡就关火，下五花肉裹匀糖色"
      - "放香叶、八角等香料，再倒酱汁：生抽两勺 + 很少一点老抽（八角够用即可，桂皮味太冲可省略）"
      - "开水漫过肉，小火咕噜；肉软后尽早捞出香料，不然味太大（其实很早就可以捞）。咕噜约 30 分钟后开盖大火收汁，收汁最后阶段放慢，差不多就行"
      - "尝一下，没盐味就再加点盐"
    images:
      - src: /assets/images/cooking/红烧肉/1.jpg
      - src: /assets/images/cooking/红烧肉/2.jpg

  - title: "法式红酒炖牛肋条"
    description: "黄油煎香后红酒慢炖，软烂浓郁；过程中注意补水和红酒"
    ingredients:
      - "牛肋条"
      - "洋葱、土豆、胡萝卜、大蒜（姜片可选）"
      - "黄油"
      - "生抽 2 勺"
      - "番茄酱 4 勺"
      - "白糖 1 勺"
      - "红酒（约到食材一半的量，炖的过程中可能还要补）"
      - "香叶 2 片、葱段 1 段"
      - "葱花（收尾撒）"
    steps:
      - "切好洋葱、土豆、胡萝卜、牛肋条、大蒜条"
      - "黄油煎牛肋条，两面煎至焦黄"
      - "不洗锅，直接下洋葱、大蒜（可加姜片）；软了之后下土豆、胡萝卜滚刀块"
      - "炒两下就下回牛肋条"
      - "加两勺酱油、四勺番茄酱、一勺白糖"
      - "倒红酒到食材一半高度，再倒开水漫过；加两片香叶、一段葱段。大火烧开后转小火慢炖约 1.5 小时"
      - "炖的过程中注意别干锅，适时加水或红酒"
      - "出锅前撒葱花即可"
    images:
      - src: /assets/images/cooking/红酒炖牛肋条/1.jpg
      - src: /assets/images/cooking/红酒炖牛肋条/2.jpg
      - src: /assets/images/cooking/红酒炖牛肋条/3.jpg

  - title: "狮子头"
    description: "剁馅调味揉团，先煎成型再蒸熟"
    ingredients:
      - "肉馅（剁细）"
      - "花椒水（边剁边加一点）"
      - "葱花"
      - "胡椒粉 少许"
      - "盐 一点点"
      - "鸡蛋 1 个"
      - "面粉 少许"
      - "油（煎制用，少许）"
    steps:
      - "把肉剁细，边剁边加点花椒水"
      - "加入葱花、一点胡椒粉、一点点盐、一个鸡蛋、一点面粉，揉成团"
      - "左右手倒一倒，把丸子团圆"
      - "锅里放一点油，下丸子煎一煎定型"
      - "煎好后捞出放盘子里，再入锅蒸熟即可"
    images:
      - src: /assets/images/cooking/狮子头/1.jpg
      - src: /assets/images/cooking/狮子头/2.jpg

  - title: "椒盐皮皮虾"
    description: "先炸后炒，味靠椒盐，可以多放"
    ingredients:
      - "皮皮虾"
      - "蒜末、小葱、洋葱、辣椒"
      - "椒盐（可多放，味道主要靠它）"
      - "油"
    steps:
      - "切好蒜末、小葱、洋葱、辣椒"
      - "炸皮皮虾，炸好盛出"
      - "留少量油，下蒜末、小葱、洋葱、辣椒炒香"
      - "倒回皮皮虾翻炒，撒入大量椒盐（味道就靠这个，可以多放）"
    images:
      - src: /assets/images/cooking/椒盐皮皮虾/1.jpg
      - src: /assets/images/cooking/椒盐皮皮虾/2.jpg

  - title: "干锅鸡翅虾"
    description: "炸香后少油炒圆葱和干锅酱，拌匀即成；这次土豆换成了红薯"
    ingredients:
      - "鸡翅、虾"
      - "土豆条（这次用了红薯）"
      - "玉米淀粉"
      - "圆葱（切片）"
      - "干锅酱 2 勺"
      - "油"
    steps:
      - "鸡翅、虾、土豆条（或红薯条）裹一遍玉米淀粉，多油炸至熟香，盛出"
      - "圆葱切片，少油炒软，再放两勺干锅酱炒匀"
      - "倒入炸好的鸡翅、虾、土豆条翻炒均匀即可"
    images:
      - src: /assets/images/cooking/干锅鸡翅虾/1.jpg
      - src: /assets/images/cooking/干锅鸡翅虾/2.jpg

  - title: "大白馒头"
    description: "温水和面一次发酵，排气整形后二次醒发再蒸"
    ingredients:
      - "中筋面粉 100g"
      - "35℃左右温水 50g（宁愿少一点）"
      - "干酵母 2.5g"
      - "白砂糖 5g（促进发酵，不喜欢可不放）"
    steps:
      - "白糖放入温水中搅拌溶解，再加入酵母"
      - "一点点倒入面粉中，成面絮状后开始握成面团"
      - "和面约 5 分钟，放入锅中发面约 30 分钟，发至 1.8–2 倍大"
      - "面团内部应呈蜂窝状；充分排气再揉面约 5 分钟。揉之前手上可沾点面粉，不然很粘手"
      - "整形揉圆，搓成长条，切成 4–5 个面剂"
      - "不开火，放到蒸笼上松弛 10 分钟（二次醒发）"
      - "开火蒸 15 分钟；关火后不开盖闷 3 分钟再开盖"
    images:
      - src: /assets/images/cooking/大白馒头/1.jpg
      - src: /assets/images/cooking/大白馒头/2.jpg

  - title: "花卷"
    description: "和面发面同馒头，擀片刷油葱花后卷切拧花再蒸；厨房冷时发酵和蒸的时间要加长"
    ingredients:
      - "中筋面粉 200g"
      - "35℃左右温水 100g（宁愿少一点）"
      - "干酵母 2.5g"
      - "白砂糖 5g（促进发酵，不喜欢可不放）"
      - "食用油（刷面用，薄薄一层）"
      - "食盐 一点点"
      - "小葱花（很重要，不然像馒头）"
      - "糖少许（可选；不要放胡椒粉）"
    steps:
      - "白糖放入温水中搅拌溶解，再加入酵母"
      - "一点点倒入面粉中，成面絮状后开始握成面团"
      - "和面约 5 分钟，放入锅中发面约 30 分钟，发至 1.8–2 倍大"
      - "面团内部应呈蜂窝状；充分排气再揉面约 5 分钟。手上或案板可撒少量干粉防粘，揉到切面没有大气孔"
      - "擀成长方形大薄片，尽量均匀；可厚约 0.5cm，不要太薄。不方正也没关系，最后那段盖一下就行"
      - "表面均匀刷一层薄油，撒一点点盐；喜欢葱就撒切碎小葱花（葱花很重要）。不要胡椒粉，可少放点糖"
      - "从长边紧紧卷成细长面卷，收口捏紧朝下"
      - "用刀切成均等小面段"
      - "取一段，用筷子在中间用力压一道竖痕；双手捏两端轻轻拉长，朝相反方向拧一圈，两端朝下捏合固定（也可以把筷子放下面卷一圈）"
      - "不开火，放到蒸笼上松弛 10 分钟（二次醒发）"
      - "开火蒸 13 分钟；关火后不开盖闷 3 分钟再开盖。以上时间是厨房较热时；冷了发酵和蒸的时间都要加长"
    images:
      - src: /assets/images/cooking/花卷/1.jpg
      - src: /assets/images/cooking/花卷/2.jpg
      - src: /assets/images/cooking/花卷/3.jpg

  - title: "避风塘炒虾"
    description: "虾新鲜可不腌；炸至金黄后中火炒面包糠，防糊"
    ingredients:
      - "虾"
      - "淀粉"
      - "蒜末"
      - "面包糠"
      - "青椒、红椒、葱"
      - "料酒（尽量少；虾新鲜可不腌）"
      - "油"
    steps:
      - "注意一定不要放太多料酒；虾新鲜的话根本不用腌"
      - "虾裹淀粉，炸至两面金黄"
      - "少油下蒜末，再下面包糠、青椒、红椒和葱"
      - "中火炒（火力太大面包糠会糊），最后下虾翻匀即可"
    images:
      - src: /assets/images/cooking/避风塘炒虾/1.jpg
      - src: /assets/images/cooking/避风塘炒虾/2.jpg

  - title: "炸茄盒"
    description: "肉馅夹茄子裹蛋粉糊，热油炸至两面金黄，可二次炸更脆"
    ingredients:
      - "茄子"
      - "猪肉馅"
      - "鸡蛋"
      - "淀粉"
      - "白胡椒粉"
      - "油（炸制用）"
    steps:
      - "猪肉馅加鸡蛋、淀粉、白胡椒粉搅拌均匀"
      - "另调一碗裹汁：淀粉和鸡蛋按一比一混合"
      - "茄子切开，夹入肉馅，再裹上汁，下热油炸；可以二次炸更脆"
      - "两面金黄即可出锅"
    images:
      - src: /assets/images/cooking/炸茄盒/1.jpg
      - src: /assets/images/cooking/炸茄盒/2.jpg

  - title: "咸蛋黄金沙鸡翅"
    description: "腌制炸香后，黄油炒咸蛋黄酱裹匀"
    ingredients:
      - "鸡翅"
      - "生抽 2 勺"
      - "黑胡椒粉 一些"
      - "料酒 1 勺"
      - "淀粉"
      - "黄油（少许）"
      - "咸蛋黄酱"
      - "油（炸制用）"
    steps:
      - "鸡翅用两勺生抽、一些黑胡椒粉、一勺料酒腌制约 20 分钟"
      - "鸡翅先裹上淀粉，多油炸至两面金黄"
      - "少黄油下锅，放入咸蛋黄酱炒至冒泡泡"
      - "下鸡翅翻炒，让每块都裹上蛋黄酱即可"
    images:
      - src: /assets/images/cooking/咸蛋黄金沙鸡翅/1.jpg

  - title: "鸡蛋饼"
    description: "淀粉水鸡蛋摊薄饼，翻面涂酱加火腿生菜；油少一点就够，两个能吃饱"
    ingredients:
      - "淀粉"
      - "水（与淀粉一比一）"
      - "鸡蛋 1 个（可做两个饼）"
      - "酱（涂面用）"
      - "火腿、生菜"
      - "油（少许即可）"
    steps:
      - "淀粉和水一比一混合，再加一个鸡蛋搅匀（一个蛋大概能摊两个饼）"
      - "少许热油后倒入一半面汁，转动锅子让汁摊匀"
      - "耐心等这一面约一分钟（看冒烟了、饼面没有汤汁了）再翻面"
      - "翻面后涂酱，放火腿和生菜"
      - "两个就能让一个人吃饱；油其实不用太多，少一点就行"
    images:
      - src: /assets/images/cooking/鸡蛋饼/1.jpg

  - title: "肉末圆葱青椒土豆"
    description: "土豆先煮软，圆葱炒甜香，肉末焦香后下酱收汁"
    ingredients:
      - "肉末"
      - "圆葱、青椒"
      - "土豆"
      - "生抽 2 勺"
      - "白糖 1 勺"
    steps:
      - "先煮土豆 3–4 分钟，煮到软烂"
      - "炒圆葱和青椒：先炒一会儿圆葱（要炒久一点才甜香，不然有点冲），再下青椒"
      - "另锅炒肉末，两面焦色后下圆葱和青椒"
      - "加两勺酱油、一勺白糖，多炒一会儿盛出"
    images:
      - src: /assets/images/cooking/肉末圆葱青椒土豆/1.jpg

  - title: "煎汤圆"
    description: "不解冻直接下锅，焖后两面煎至金黄"
    ingredients:
      - "汤圆（不用解冻）"
      - "油（少许）"
      - "水（小半碗）"
    steps:
      - "不解冻，锅中少许油，下汤圆滚动一下"
      - "加小半碗水，盖上盖，中小火焖约 5 分钟"
      - "开盖，煎到汤圆可以自由滑动"
      - "翻面再煎约 5 分钟，主要是两面金黄即可"
    images:
      - src: /assets/images/cooking/煎汤圆/1.jpg
      - src: /assets/images/cooking/煎汤圆/2.jpg

  - title: "尖椒牛肉 · 地三鲜"
    description: "尖椒牛肉大火滑炒，配炸香收汁的地三鲜"
    ingredients:
      - "【尖椒牛肉】牛肋条、大蒜、辣椒、淀粉、生抽、蚝油、油；料汁：生抽 1 勺、老抽半勺、一点点糖"
      - "【地三鲜】土豆、茄子、青椒、蒜末；料汁：白糖 1 勺、生抽 1 勺、蚝油 1 勺、老抽 1 勺、淀粉 1 勺、半碗清水化开；油"
    steps:
      - "【尖椒牛肉】牛肋条加一勺淀粉、一勺生抽、一勺蚝油抓拌，再加一勺油抓拌，腌制约 15 分钟"
      - "【尖椒牛肉】油热下牛肉，变色后捞出；另起油热炒大蒜，加辣椒炒至断生"
      - "【尖椒牛肉】下回牛肉和料汁，大火翻炒一下即可"
      - "【地三鲜】土豆、茄子、青椒切滚刀块；很多油漫过土豆，四到五成油温小火慢炸至筷子一扎就透"
      - "【地三鲜】茄子裹淀粉，六到七成高温下锅；金黄收缩后下青椒约 10 秒，一起捞出"
      - "【地三鲜】留底油炒一半蒜末，下土豆茄子青椒，倒料汁；汁粘稠后放尾蒜盛出"
    images:
      - src: /assets/images/cooking/地三鲜/1.jpg

  - title: "炸黄花鱼 · 蚝油生菜"
    description: "黄花鱼中火炸透，配蒜香蚝油生菜"
    ingredients:
      - "【黄花鱼】黄花鱼、料酒、淀粉、油"
      - "【蚝油生菜】生菜、蒜、蚝油 1 勺、生抽 2 勺、水 2 勺、油"
    steps:
      - "【黄花鱼】切腹挖干净内脏，切开摊平"
      - "【黄花鱼】泡料酒 10–15 分钟，拿出来洗一下（不然一吃全是料酒味）"
      - "【黄花鱼】正反面涂淀粉；热油下鱼，中火每面约 6 分钟（可久一些），捞出即可"
      - "【蚝油生菜】开水下生菜，约 30 秒软了就捞出"
      - "【蚝油生菜】热油下蒜炒香，加料汁（一勺蚝油、两勺生抽、两勺水）煮一会儿，浇在生菜上"
    images:
      - src: /assets/images/cooking/炸黄花鱼/1.jpg
      - src: /assets/images/cooking/炸黄花鱼/2.jpg

  - title: "蒜薹炒肉 · 赛螃蟹"
    description: "蒜薹炒肉丝配蛋清咸鸭蛋黄的赛螃蟹"
    ingredients:
      - "【赛螃蟹】鸡蛋 3 个、咸鸭蛋 1 个、姜；料汁：姜末、酱油 1 勺、醋 1 勺、料酒很少、白糖半勺、淀粉 1 勺、清水 2 勺"
      - "【蒜薹炒肉】肉丝、蒜薹；腌料：酱油 2 勺、料酒 1 勺、淀粉 1 勺、老抽半勺、盐半勺；料汁：酱油 1 勺、老抽半勺（可少放糖）；油"
    steps:
      - "【赛螃蟹】碗里放姜末、一勺酱油、一勺醋、很少料酒、半勺白糖、一勺淀粉、两勺清水搅拌成料汁"
      - "【赛螃蟹】蛋清蛋黄分离，先炒蛋清盛出"
      - "【赛螃蟹】再炒咸鸭蛋，倒入蛋黄液；下回蛋清，再下料汁翻炒出锅"
      - "【蒜薹炒肉】肉丝用两勺酱油、一勺料酒、一勺淀粉、半勺老抽、半勺盐腌制"
      - "【蒜薹炒肉】油热下蒜薹，炒至抽巴盛出"
      - "【蒜薹炒肉】油热炒肉丝，下回蒜薹；加料汁（一勺酱油、半勺老抽），可少放点儿糖"
