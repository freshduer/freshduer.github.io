page_title: 盲派八字
page_lead: "按这个顺序看：先寻根、定出处、找份额，再分家里家外，再看做工怎么拿财官。"

xungen:
  title: 寻根、定出处、找份额
  points:
    - "寻根：天干只是名，地支才是根。禄、刃最真，本气次之，中气、余气更浅。没根的干，再好看也是虚的。"
    - "定出处：这个十神从哪一支出来。月令出来的最有权，日支是自己家里的，年柱远、时柱晚。"
    - "找份额：四个地支的藏干加在一起，看日主、财、官、印、食伤各占多少。份额大的才是真事，不要被透干骗走。"

jiali:
  title: 家里、家外
  points:
    - "地支是家里：已经有的、内里能守住的。天干是家外：外面求的、别人看得见的。"
    - "家里有、外面透：实，能用。家里有、外面不透：有，但闷着。家里无、外面透：虚，岁运给根才算数。"
    - "日支是自己家，月令是门口，年柱是外面场子。"

zuogong:
  title: 做工，怎么拿到财官
  points:
    - "做工就是看哪条五行路是通的。路通才能拿到，路被劫、被夺、被合住，就只是看着有。"
    - "拿财：身有根，用食伤去生财，或官杀掉比劫后再去拿。身太弱、财份额太大，是财来扛不住。"
    - "拿官：身有根，用财去生官，或官有印来化。身弱见官是压力；官没根、只有干上一点，是虚名。"

example:
  title: 例子
  pillars: "甲寅 丙寅 甲午 己巳"
  chart_note: "甲木日主。寅藏甲丙戊，午藏丁己，巳藏丙戊庚。"
  steps:
    - heading: 寻根、出处、份额
      text: "甲的根在两寅，禄很真，日主份额大。丙火从寅、巳出来，午里还有丁，火的份额也大。己土正财从时干透出，根在午中己、巳中戊，土有根但比木火小。金只有巳中一点庚，水没有。"
    - heading: 家里家外
      text: "家里四支全是木火土：两寅是禄，午、巳是食伤和财。家外透了丙（伤官）和己（正财）。官星金既不透、根又浅，家里几乎没有官。"
    - heading: 做工，拿什么
      text: "身旺，正路是木生火、火生土。丙火做工去生时上己土，己坐巳有根，财能拿到。官拿不稳，原局先发财，不先发官；以后岁运出现有根的金，再论官职。"

ganwu:
  title: 感悟
  lines:
    - "八字不是一定的，但是运势是真实存在的。"
    - "人要努力，但是也得有运啊。"
